<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Product List</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
    <header class="header">
        <h1>Product Catalog</h1>
        <a class="btn-primary" th:href="@{/products/add}">Add New Product</a>
    </header>

    <div class="product-grid">
        <div class="product-card" th:each="product : ${products}">
            <img class="product-image" th:src="${product.image}" alt="Product Image" />
            <h2 class="product-title" th:text="${product.name}">Product Name</h2>
            <p class="product-price" th:text="${product.price}">$0.00</p>
            <p class="product-desc" th:text="${product.description}">Product Description</p>
            <a class="btn-secondary" th:href="@{/products/details/{id}(id=${product.id})}">View Details</a>
        </div>
    </div>
</body>
</html>
